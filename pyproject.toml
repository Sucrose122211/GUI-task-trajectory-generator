[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-trajectory"
version = "0.1.0"
description = "Subscription CLI teachers for GUI grounding demonstrations"
requires-python = ">=3.10"
dependencies = ["Pillow==12.0.0"]

[project.scripts]
gui-trajectory = "gui_trajectory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gui_trajectory = ["resources/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

